name: Build website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Verify the AliKit catalog pin
        run: npm run check:catalog
      - name: Build
        env:
          PUBLIC_BASE_PATH: /alicorn-website
          PUBLIC_SITE_URL: https://carnival-science.github.io
        run: npm run build
      - name: Crawl internal links
        env:
          PUBLIC_BASE_PATH: /alicorn-website
        run: npm run check:links
